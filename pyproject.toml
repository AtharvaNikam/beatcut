[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "beatcut"
version = "0.1.0"
description = "Beat-synced short-form montage editor (Reels/TikTok/Shorts): analyze song + footage, draft a cut list, render, verify sync."
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "pillow>=10"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
beatcut = "beatcut.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
